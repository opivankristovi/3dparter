name: Firefox tests

# Firefox cannot start on the main dev machine (a Windows Insider build), so its end-to-end run lives here.
# Manual trigger only: Actions > Firefox tests > Run workflow, or `gh workflow run firefox.yml`.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: Only run tests whose title matches this (empty = all)
        required: false
        default: ''
      workers:
        description: Parallel browsers
        required: false
        default: '1'
      trace:
        description: Keep Playwright traces of failures (on/off)
        required: false
        default: 'off'

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      # Headless Firefox finds no GL driver on a GPU-less runner, so run it with a window on a virtual screen
      # (Xvfb) where Mesa's software renderer gives it WebGL.
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Firefox end-to-end
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npx playwright test --project=firefox-desktop --headed --reporter=line --max-failures=15 --workers=${{ inputs.workers }} --trace=${{ inputs.trace == 'on' && 'retain-on-failure' || 'off' }} ${{ inputs.grep != '' && format('-g "{0}"', inputs.grep) || '' }}
        env:
          CROSS_BROWSER: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firefox-test-results
          path: app/test-results
          retention-days: 7
