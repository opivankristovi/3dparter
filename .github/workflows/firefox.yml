name: Firefox tests

# Firefox cannot start on the main dev machine (a Windows Insider build), so its end-to-end run lives here.
# Manual trigger only: Actions > Firefox tests > Run workflow, or `gh workflow run firefox.yml`.
on:
  workflow_dispatch:

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Firefox end-to-end
        run: npx playwright test --project=firefox-desktop --reporter=line
        env:
          CROSS_BROWSER: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firefox-test-results
          path: app/test-results
          retention-days: 7
